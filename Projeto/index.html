<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Tecnologias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-black text-gray-900">

    <!-- Navbar -->
    <nav class="bg-black text-white p-4 fixed w-full top-0 shadow-md">
        <div class="container mx-auto flex justify-between items-center mt-4">
            <img src="assets/cmLogo.jpg" alt="" class="w-40 h-auto ml-16">
            <button class="mr-16">
                <img src="assets/menuSanduiche.png" alt="" class="w-10 h-auto">
            </button>
        </div>
    </nav>

    <section class="dodeca-section">
        <canvas id="dodecaCanvas"></canvas>
    </section>

    <section class="bg-[#cba34d] text-white text-center py-20 mt-20">
        <!-- bg-transparent -->
        <div class="text-white bg-black text-center py-40 mt-20 w-[100%]">
            <div>
                <h1 class="OutfitTituloFino">
                    <span class="OutfitTitulo">Transformamos</span> seus ambientes<br> em uma extensão <span
                        class="OutfitTitulo">de você!</span>
                </h1>
            </div>
            <div>
                <p class="OutfitTextoCinza">
                    Proporcionar soluções tecnológicas integradas que traz
                    segurança, conforto e praticidade através de automação,
                    inteligência e inovação em todos os detalhes.
                </p>
            </div>
            <div>
                <button
                    class="bg-[#cba34d] text-center w-[280px] rounded-3xl h-14 relative text-black text-xl font-semibold group"
                    type="button">

                    <div
                        class="bg-black rounded-full h-12 w-1/4 flex items-center text-white justify-center absolute left-1 top-[4px] bottom-[4px] right-1 group-hover:w-[98%] z-10 duration-500">
                        <!-- <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 1024 1024"
                        height="25px"
                        width="25px"
                        > -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                        <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z" fill="#000000"></path>
                        <path
                            d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
                            fill="#000000"></path>
                        </svg>
                    </div>

                    <p class="translate-x-8">Nossos Trabalhos</p>

                </button>
                <button
                    class="bg-black text-center w-[280px] rounded-3xl h-14 relative text-white text-xl font-semibold group"
                    type="button">

                    <div
                        class="bg-black rounded-full h-12 w-1/4 flex items-center text-white justify-center absolute left-1 top-[4px] bottom-[4px] right-1 group-hover:w-[98%] z-10 duration-500 border border-white">
                        <!-- <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 1024 1024"
                        height="25px"
                        width="25px"
                        > -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                        </svg>
                        <path d="M224 480h640a32 32 0 1 1 0 64H224a32 32 0 0 1 0-64z" fill="#000000"></path>
                        <path
                            d="m237.248 512 265.408 265.344a32 32 0 0 1-45.312 45.312l-288-288a32 32 0 0 1 0-45.312l288-288a32 32 0 1 1 45.312 45.312L237.248 512z"
                            fill="#000000"></path>
                        </svg>
                    </div>

                    <p class="translate-x-6">Contato</p>

                </button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <!-- <footer class="bg-black text-white text-center p-4 mt-12">
        <p>&copy; 2025 Minha Empresa. Todos os direitos reservados.</p>
    </footer> -->
    <script src="js/script.js"></script>
</body>

</html>
